<p class="artist">Traditional lullaby</p>
<p class="album">Nursery rhymes (public domain)</p>
<p class="year">c. 1765</p>

<p class="verse">Rock-a-bye baby, on the treetop,<br>When the wind blows, the cradle will rock,</p>
<p class="chorus">When the bough breaks, the cradle will fall,<br>And down will come baby, cradle and all.</p>
